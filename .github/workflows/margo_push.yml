name: "Margo push"
on:
  workflow_call:
    inputs:
      hbv-version:
        description: HBV image tag, also used as the Margo app version
        required: true
        type: string
      bart-version:
        description: Tag of the bart image to run
        required: false
        default: latest
        type: string
    secrets:
      BART_REGISTRY_USER:
        required: true
      BART_REGISTRY_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      hbv-version:
        description: HBV image tag, also used as the Margo app version
        required: true
        type: string
      bart-version:
        description: Tag of the bart image to run
        required: false
        default: latest
        type: string

permissions:
  contents: read

jobs:
  margo-push:
    runs-on: ubuntu-latest
    env:
      BART_IMAGE: cr.flecs.tech/flecs/bart:${{ inputs.bart-version }}
      HBV_VERSION: ${{ inputs.hbv-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Pin HBV image to ${{ env.HBV_VERSION }}
        run: |
          set -eu
          sed -Ei "s|^(\s*image:\s*ghcr.io/pcps/flowdeviceverification):.*$|\1:${HBV_VERSION}|" margo/compose/compose.yaml
          grep -Eq "^\s*image:\s*ghcr.io/pcps/flowdeviceverification:${HBV_VERSION}$" margo/compose/compose.yaml

      - name: bart push
        env:
          BART_REGISTRY_USER: ${{ secrets.BART_REGISTRY_USER }}
          BART_REGISTRY_TOKEN: ${{ secrets.BART_REGISTRY_TOKEN }}
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace \
            -e BART_REGISTRY_USER \
            -e BART_REGISTRY_TOKEN \
            "${BART_IMAGE}" \
            push --dir margo --version "${HBV_VERSION}"
